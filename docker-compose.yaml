version: "3.8"

# Local-dev MongoDB. Mongo's replica set + auth combo requires a keyFile
# (see https://www.mongodb.com/docs/manual/tutorial/enforce-keyfile-access-control-in-existing-replica-set/),
# and the original compose file shipped with neither — which is why it was
# crash-looping. For local dev we run without auth (Prisma + replica set still
# work the same way; just don't ship this to prod).

services:
  mongodb:
    image: mongo:7
    container_name: mongodb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
    networks:
      - mongo_network
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ ping: 1 }).ok"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 40s

volumes:
  mongodb_data:
  mongodb_config:

networks:
  mongo_network:
    driver: bridge
